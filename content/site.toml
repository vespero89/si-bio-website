# Site settings, the only settings file. Languages listed here are published; a language in
# config.LANGS that is not listed answers 404 (it shows with PREVIEW=1). Italian must be listed.
# A value that holds a marker like [DA COMPLETARE: ...] is hidden in production and shown in
# preview (see app/content.py).
[languages]
published = ["it", "en"]

[company]
name = "SI - BIO di Premici & Aleandri Società Agricola Semplice"
vat = "02274900444"
address = "[DA COMPLETARE: sede legale]"
pec = "[DA COMPLETARE: PEC]"
rea = "[DA COMPLETARE: numero REA]"

[contact]
export_email = "export@si-bio.it"
# Fuselli e Filari receive the gift package requests directly, Si Bio is not in the way.
partner_email = "[DA COMPLETARE: contatto email di Fuselli e Filari]"
phone = "[DA COMPLETARE: telefono, solo se la responsabile commerciale lo vuole]"

[farm]
# Home of the family farm; the language prefix is added by the template.
url = "[DA COMPLETARE: indirizzo del sito della fattoria]"

[social]
instagram = "[DA VERIFICARE: profilo social, se esiste]"
facebook = "[DA VERIFICARE: profilo social, se esiste]"

[video]
youtube_id = "[DA COMPLETARE: identificativo del video YouTube]"
cover = "[DA COMPLETARE: immagine di copertina del video]"

[switches]
riva_dei_martin = false
organic_certified = true   # turns on the certificate block and the sentence "organic farm"

# The organic certificate (shown only while organic_certified is on). verify_url is the operator's
# page in the European register, which always shows the current certificate; the QR code encodes it,
# so a renewal changes nothing here but the numbers. Regenerate the QR with scripts/qr.py if
# verify_url changes.
[certificate]
number = "IT-BIO-004.380-0031262.2026.004"
body = "Suolo e Salute Srl (IT-BIO-004)"
regulation = "Reg. (UE) 2018/848"
valid_from = "2026-08-25"
valid_until = "2029-08-24"
holder = "Si Bio di Premici Silvia e Aleandri Vincenzo, società semplice agricola"
holder_address = "Contrada San Lazzaro 118, 63073 Offida"
verify_url = "https://webgate.ec.europa.eu/tracesnt/directory/publication/organic-operator/IT-BIO-004.380-0031262.2026.004.pdf"
qr = "certificate-qr.svg"
