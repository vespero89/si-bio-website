organic = "Si Bio is a certified organic farm. The certificate covers the cultivation of grapes, olives and cereals."
music_title = "Silvia and the piano"
music = """Silvia Premici is a partner of Si Bio and Vincenzo's wife. She is a pianist with a jazz diploma from the conservatory. The musical notes in the Si Bio logo come from her.

The names of two wines come from music too. Armide is the opera by Jean-Baptiste Lully, from 1686; Passacaille is the dance that closes the fifth act of the same opera.

The soundtrack of our video is her original composition."""
