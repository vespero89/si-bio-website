mission = "Our mission is to produce wines that express the authentic identity of the Piceno, enhancing the land, the native grape varieties and the work in the vineyard. A careful approach to viticulture and limited intervention: wines that tell the story of our land and carry the identity of the Piceno beyond the borders of the Marche."
territory = "The Piceno is a land of hills, vineyards and old farming traditions, in the heart of the Marche, still little known outside Italy. A few kilometres from the Adriatic Sea and at the foot of the Sibillini Mountains, the hills of Offida offer favourable conditions for viticulture. Climate, soils and native varieties such as Pecorino and Passerina give wines tied to their place of origin."
