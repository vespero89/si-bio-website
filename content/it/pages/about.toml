title = "Chi siamo"
family = """Si Bio nasce dall'incontro di due storie. Quella di Vincenzo, che porta avanti la tradizione della Fattoria nel Ciafone e lavora la terra con rispetto, e quella di Silvia Premici, pianista jazz.

Una vigna e una tastiera: lo stesso ascolto, la stessa pazienza."""
mission = "La nostra missione è produrre vini che esprimano l'identità autentica del Piceno, valorizzando territorio, vitigni autoctoni e il lavoro in vigna. Un approccio attento in viticoltura e interventi limitati: vini che raccontano la nostra terra e portano l'identità del Piceno oltre i confini delle Marche."
territory = "Il Piceno è una terra di colline, vigneti e antiche tradizioni agricole, nel cuore delle Marche, ancora poco conosciuta fuori dall'Italia. A pochi chilometri dall'Adriatico e ai piedi dei Monti Sibillini, le colline di Offida offrono condizioni favorevoli alla viticoltura. Clima, suoli e vitigni nativi come Pecorino e Passerina danno vini legati al luogo d'origine."
sales_contact = "[DA DEFINIRE: ruolo della responsabile commerciale, nome e foto solo se è d'accordo]"
riva_dei_martin = "Vincenzo Aleandri guida anche Riva dei Martin, cantina di Valdobbiadene Prosecco Superiore DOCG."
organic = "Si Bio è un'azienda agricola biologica certificata. Il certificato riguarda la coltivazione di uva, olive e cereali."
music_title = "Silvia e il pianoforte"
music = """Silvia Premici, socia di Si Bio e moglie di Vincenzo, è pianista, diplomata in jazz al conservatorio. Le note musicali del logo di Si Bio vengono da lei.

Dalla musica vengono anche i nomi di due vini. Armide è l'opera di Jean-Baptiste Lully, del 1686; Passacaille è la danza che chiude il quinto atto della stessa opera.

La colonna sonora del nostro video è una sua composizione originale."""
